<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        h1,
        h2,
        h3 {
            color: #111;
            margin-top: 24px;
        }

        p {
            margin-bottom: 16px;
        }

        ul,
        ol {
            margin-bottom: 16px;
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        code {
            background-color: #f4f4f4;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        pre {
            background-color: #f4f4f4;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
        }

        blockquote {
            border-left: 4px solid #ddd;
            padding-left: 16px;
            margin-left: 0;
            color: #666;
            font-style: italic;
        }

        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 24px 0;
        }
    </style>
</head>

<body>
    {{content}}
</body>

</html>
